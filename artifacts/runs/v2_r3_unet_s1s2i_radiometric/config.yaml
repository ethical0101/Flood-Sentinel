seed: 42
run_name: v2_r3_unet_s1s2i_radiometric
data:
  modality: s1s2i
  crop_size: 256
  crops_per_chip: 4
  num_workers: 2
  augment: true
  radiometric:
    enabled: true
    p: 0.8
    s2_gain:
    - 0.75
    - 1.25
    s2_band_jitter: 0.05
    s1_offset_db: 2.0
    s1_pol_jitter_db: 0.5
model:
  arch: unet
  encoder: resnet34
  encoder_weights: imagenet
train:
  epochs: 60
  batch_size: 8
  grad_accum: 1
  lr: 0.0005
  weight_decay: 0.0001
  warmup_epochs: 2
  amp: true
  bce_weight: 1.0
  dice_weight: 1.0
  pos_weight: null
  early_stopping_patience: 15
  monitor: val_iou_water
  threshold: 0.5
