seed: 42
run_name: unet_resnet34_s1s2
data:
  modality: s1s2
  crop_size: 256
  crops_per_chip: 4
  num_workers: 2
  augment: true
model:
  arch: unet
  encoder: resnet34
  encoder_weights: imagenet
train:
  epochs: 60
  batch_size: 8
  grad_accum: 1
  lr: 0.0005
  weight_decay: 0.0001
  warmup_epochs: 2
  amp: true
  bce_weight: 1.0
  dice_weight: 1.0
  pos_weight: null
  early_stopping_patience: 15
  monitor: val_iou_water
  threshold: 0.5
